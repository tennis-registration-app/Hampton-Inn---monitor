name: Hilton Availability Monitor

on:
  # ──────────────────────────────────────────────────────────────────────────
  # Cron is PAUSED while we validate the classifier.
  # Re-enable by uncommenting the schedule block once test runs look correct.
  # ──────────────────────────────────────────────────────────────────────────
  # schedule:
  #   - cron: '15 */2 * * *'   # every 2 hours
  workflow_dispatch:
    inputs:
      arrival:
        description: 'Test arrival date (YYYY-MM-DD). Leave blank for production scan (May 22–30, 2027).'
        required: false
        default: ''
      nights:
        description: 'Stay lengths, comma-separated (e.g. "2" or "2,3,4"). Used with arrival.'
        required: false
        default: '2'
      days:
        description: 'Number of consecutive check-in days starting at arrival (e.g. "1" or "3").'
        required: false
        default: '1'
      skip_notify:
        description: 'Skip ntfy notification (true/false).'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      debug:
        description: 'Save rendered HTML / screenshot / XHR log to artifacts.'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run availability monitor
        env:
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
          TEST_ARRIVAL: ${{ github.event.inputs.arrival }}
          TEST_NIGHTS:  ${{ github.event.inputs.nights }}
          TEST_DAYS:    ${{ github.event.inputs.days }}
          SKIP_NOTIFY:  ${{ github.event.inputs.skip_notify }}
          DEBUG:        ${{ github.event.inputs.debug }}
        run: python monitor.py

      - name: Upload debug artifacts
        if: ${{ always() && github.event.inputs.debug == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
